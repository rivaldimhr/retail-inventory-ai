[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # Fail on deprecations coming from our own code, so they are fixed early.
    error::DeprecationWarning:src.*
    error::FutureWarning:src.*
    # Third-party notice from Starlette's test client; not actionable in this project.
    ignore:Using `httpx` with `starlette.testclient`
