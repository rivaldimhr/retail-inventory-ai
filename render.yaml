# Render Blueprint: deploys the API (with the Chat AI) as a free web service.
# Render dashboard -> New -> Blueprint -> select this repository.
# You will be asked for LLM_API_KEY (e.g. a free Groq key from console.groq.com).
services:
  - type: web
    name: retail-inventory-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_API_KEY
        sync: false
      - key: CHAT_RATE_PER_MINUTE
        value: "10"
