name: Deploy API to Hugging Face Spaces

# Runs on every push to main once these are set in the GitHub repository
# (Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  = Hugging Face access token with "write" permission
#   variable HF_SPACE  = <hf-username>/<space-name>, e.g. rivaldimhr/retail-inventory-ai
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the Space folder
        run: |
          mkdir -p space
          cp -r Dockerfile requirements-api.txt src space/
          mkdir -p space/public && cp -r public/demo space/public/
          cat > space/README.md <<'MD'
          ---
          title: Retail Inventory AI API
          emoji: 📦
          colorFrom: indigo
          colorTo: green
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          Backend API for [Retail Inventory AI](https://github.com/rivaldimhr/retail-inventory-ai):
          7-day demand forecast, reorder recommendations, market basket and an AI chat (Groq).
          Health check: `/api/v1/health` · API docs: `/docs`
          MD
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE is not set; skipping deploy."
            exit 0
          fi
          cd space
          git init -q -b main
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE}"
